version: '3.8'

services:
  micro-journal:
    build: .
    container_name: micro-journal
    restart: unless-stopped
    volumes:
      # Mount data directory for persistence
      - ${HOME}/.micro-journal:/home/appuser/.micro-journal
    environment:
      - NODE_ENV=production
      - PORT=3000
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"

      # HTTP router (redirect to HTTPS)
      - "traefik.http.routers.micro-journal-http.rule=Host(`mj.noelr.ch`)"
      - "traefik.http.routers.micro-journal-http.entrypoints=web"
      - "traefik.http.routers.micro-journal-http.middlewares=redirect-to-https"

      # HTTPS router
      - "traefik.http.routers.micro-journal.rule=Host(`mj.noelr.ch`)"
      - "traefik.http.routers.micro-journal.entrypoints=websecure"
      - "traefik.http.routers.micro-journal.tls.certresolver=letsencrypt"

      # Service configuration
      - "traefik.http.services.micro-journal.loadbalancer.server.port=3000"

      # Redirect middleware
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik

networks:
  traefik:
    external: true
